
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дедлайнер — студентський планер</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #ffe3ef, #fff8fc);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      --bg: #fff9fc;
      --card: #ffffff;
      --text: #352b3a;
      --muted: #968b99;
      --pink: #f35b9d;
      --pink-dark: #dc3d83;
      --soft: #fff0f6;
      --border: #f2e4ec;

      position: relative;
      width: 100%;
      max-width: 460px;
      height: 800px;
      overflow: hidden;
      border-radius: 28px;
      background: var(--bg);
      color: var(--text);
      box-shadow: 0 20px 60px #a94d7b30;
      transition: background 0.3s, color 0.3s;
    }

    .app.dark {
      --bg: #211c27;
      --card: #302735;
      --text: #fff0f7;
      --muted: #b9aaba;
      --pink: #fa7caf;
      --pink-dark: #ff9bc5;
      --soft: #422b3c;
      --border: #493c4b;
    }

    .screen {
      height: 100%;
      overflow-y: auto;
      padding: 24px 22px 140px;
      scrollbar-width: thin;
    }

    /* Шапка */

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 23px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 43px;
      height: 43px;
      border-radius: 14px;
      background: linear-gradient(135deg, #ff8fba, #e94d91);
      color: white;
      animation: breathe 3s infinite;
    }

    .brand-name {
      font-size: 21px;
      font-weight: 850;
      letter-spacing: -0.7px;
    }

    .brand-name span {
      color: var(--pink);
    }

    .brand-subtitle {
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
    }

    .avatar {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--soft);
      color: var(--pink);
    }

    

    .hero {
      position: relative;
      overflow: hidden;
      padding: 23px 20px;
      border-radius: 22px;
      background: linear-gradient(130deg, #f978ae, #e84e92);
      color: white;
      box-shadow: 0 10px 25px #ef5a9b30;
    }

    .hero-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .hero h1 {
      margin: 10px 0;
      font-size: 25px;
      line-height: 1.2;
    }

    .hero p {
      max-width: 260px;
      margin: 0;
      font-size: 12px;
      line-height: 1.6;
    }

    .hero-flower {
      position: absolute;
      right: 22px;
      top: 48px;
      font-size: 56px;
      animation: float 3s ease-in-out infinite;
    }

    

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 17px 0 26px;
    }

    .stat {
      padding: 15px 8px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: var(--card);
      text-align: center;
    }

    .stat strong {
      display: block;
      margin-bottom: 4px;
      font-size: 25px;
    }

    .stat:nth-child(2) strong {
      color: var(--pink);
    }

    .stat:nth-child(3) strong {
      color: #54bd97;
    }

    .stat span {
      color: var(--muted);
      font-size: 11px;
    }

    

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 0 0 14px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 18px;
    }

    .section-heading small {
      color: var(--muted);
    }

    .page-title {
      margin: 0 0 6px;
      font-size: 25px;
    }

    .page-subtitle {
      margin: 0 0 23px;
      color: var(--muted);
      font-size: 12px;
    }

    

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .filter {
      flex: 1;
      padding: 10px 5px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--card);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      transition: 0.2s;
    }

    .filter.active {
      border-color: var(--pink);
      background: var(--pink);
      color: white;
    }

    

    .task {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 11px;
      padding: 15px 13px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: var(--card);
      animation: slideIn 0.3s ease both;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .task:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px #d15d9515;
    }

    .task-check {
      display: grid;
      place-items: center;
      flex-shrink: 0;
      width: 25px;
      height: 25px;
      margin-top: 2px;
      padding: 0;
      border: 2px solid #e9bfd3;
      border-radius: 9px;
      background: transparent;
      color: white;
    }

    .task-check.checked {
      border-color: #52be98;
      background: #52be98;
      animation: pop 0.35s;
    }

    .task-body {
      flex: 1;
      min-width: 0;
      padding: 0;
      border: none;
      background: transparent;
      color: var(--text);
      text-align: left;
    }

    .task-title {
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .task-title.done {
      color: var(--muted);
      text-decoration: line-through;
    }

    .task-description {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .task-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 8px;
      border-radius: 8px;
      background: var(--soft);
      color: var(--pink-dark);
      font-size: 10px;
      font-weight: 700;
    }

    .tag.late {
      background: #fff0eb;
      color: #e36b55;
    }

    .tag.completed {
      background: #e5f8ef;
      color: #319b73;
    }

    .task-arrow {
      margin-top: 3px;
      color: var(--muted);
    }

    

    .empty {
      padding: 36px 20px;
      border: 1px dashed #ecbad0;
      border-radius: 19px;
      background: var(--card);
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      line-height: 1.7;
    }

    .empty-emoji {
      display: block;
      margin-bottom: 10px;
      font-size: 37px;
    }

    

    .navigation {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 5;
      display: flex;
      justify-content: space-around;
      height: 78px;
      padding: 12px 8px;
      border-top: 1px solid var(--border);
      background: var(--card);
    }

    .nav-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      min-width: 80px;
      padding: 4px 8px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
    }

    .nav-button.active {
      color: var(--pink);
    }

    .nav-button.active svg {
      animation: pop 0.35s;
    }

    

    .fab {
      position: absolute;
      right: 23px;
      bottom: 94px;
      z-index: 4;
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      border: none;
      border-radius: 19px;
      background: linear-gradient(135deg, #ff86b6, #e94b90);
      color: white;
      box-shadow: 0 9px 22px #eb579a55;
      transition: transform 0.25s;
    }

    .fab:hover {
      transform: rotate(90deg) scale(1.08);
    }

    

    .calendar-card {
      margin-bottom: 23px;
      padding: 17px 13px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--card);
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 17px;
    }

    .calendar-month {
      font-size: 16px;
      font-weight: 800;
    }

    .calendar-arrows {
      display: flex;
      gap: 7px;
    }

    .icon-button {
      display: grid;
      place-items: center;
      width: 33px;
      height: 33px;
      border: none;
      border-radius: 10px;
      background: var(--soft);
      color: var(--pink);
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
      text-align: center;
    }

    .weekday {
      padding: 6px 0 10px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
    }

    .calendar-day {
      position: relative;
      display: grid;
      place-items: center;
      height: 42px;
      border: none;
      border-radius: 12px;
      background: transparent;
      color: var(--text);
      font-size: 12px;
    }

    .calendar-day.today {
      outline: 1px solid #f4b4d0;
      outline-offset: -2px;
    }

    .calendar-day.selected {
      background: var(--pink);
      color: white;
    }

    .calendar-dot {
      position: absolute;
      bottom: 4px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--pink);
    }

    .calendar-day.selected .calendar-dot {
      background: white;
    }

    

    .settings-card {
      margin-bottom: 19px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 19px;
      background: var(--card);
    }

    .setting-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .setting-row:last-child {
      border-bottom: none;
    }

    .setting-icon {
      display: grid;
      place-items: center;
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--soft);
      color: var(--pink);
    }

    .setting-text {
      flex: 1;
      min-width: 0;
    }

    .setting-text strong {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
    }

    .setting-text small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.5;
    }

    .switch {
      flex-shrink: 0;
      width: 43px;
      height: 26px;
      padding: 3px;
      border: none;
      border-radius: 20px;
      background: #ded2db;
      transition: background 0.2s;
    }

    .switch::before {
      display: block;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: white;
      content: "";
      transition: transform 0.2s;
    }

    .switch.on {
      background: var(--pink);
    }

    .switch.on::before {
      transform: translateX(17px);
    }

    .small-select {
      max-width: 125px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--bg);
      color: var(--text);
      font-size: 11px;
    }

    .profile-input {
      width: 100%;
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--bg);
      color: var(--text);
      outline: none;
    }

    .profile-box {
      padding: 16px;
    }

    .profile-box label {
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 700;
    }

    .note {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
    }

    
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: flex-end;
      background: #25132299;
    }

    .overlay[hidden] {
      display: none;
    }

    .modal {
      width: 100%;
      max-height: 93%;
      overflow-y: auto;
      padding: 23px 22px 30px;
      border-radius: 26px 26px 0 0;
      background: var(--card);
      animation: modalUp 0.3s ease both;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 21px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .close-button {
      display: grid;
      place-items: center;
      width: 35px;
      height: 35px;
      border: none;
      border-radius: 11px;
      background: var(--soft);
      color: var(--pink);
    }

    

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 12px;
      font-weight: 800;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg);
      color: var(--text);
      outline: none;
      font-size: 13px;
    }

    .field textarea {
      min-height: 80px;
      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: var(--pink);
    }

    .field input.invalid {
      border-color: #e94e6a;
      background: #fff0f2;
      color: #352b3a;
    }

    .error-message {
      min-height: 15px;
      margin-top: 5px;
      color: #e94e6a;
      font-size: 11px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    

    .primary-button,
    .secondary-button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 13px 16px;
      border: none;
      border-radius: 13px;
      font-size: 12px;
      font-weight: 800;
      transition: transform 0.2s;
    }

    .primary-button {
      background: var(--pink);
      color: white;
    }

    .secondary-button {
      border: 1px solid var(--border);
      background: var(--soft);
      color: var(--pink-dark);
    }

    .danger-button {
      background: #fff0f2;
      color: #e85d75;
    }

    .full-width {
      width: 100%;
    }

    .button-row {
      display: flex;
      gap: 9px;
      margin-top: 18px;
    }

    .button-row > button {
      flex: 1;
    }

    button:active {
      transform: scale(0.96);
    }

    

    .detail-title {
      margin: 12px 0;
      font-size: 24px;
      overflow-wrap: anywhere;
    }

    .detail-description {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .detail-info {
      display: grid;
      gap: 14px;
      margin-top: 20px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--bg);
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 12px;
    }

    .info-row svg {
      color: var(--pink);
    }

    

    .success {
      position: relative;
      padding: 15px 0 10px;
      text-align: center;
    }

    .success-icon {
      display: grid;
      place-items: center;
      width: 85px;
      height: 85px;
      margin: 12px auto 20px;
      border-radius: 50%;
      background: var(--pink);
      color: white;
      animation: pop 0.55s ease both;
    }

    .success-icon svg {
      width: 43px;
      height: 43px;
      animation: pop 0.6s 0.15s both;
    }

    .success h2 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    .success p {
      margin-bottom: 24px;
      color: var(--muted);
      font-size: 13px;
    }

    .confetti {
      position: absolute;
      top: 0;
      font-size: 23px;
      animation: float 2s infinite;
    }

    .confetti.left {
      left: 22px;
    }

    .confetti.right {
      right: 22px;
      animation-delay: 0.4s;
    }

    

    .toast {
      position: absolute;
      top: 17px;
      right: 20px;
      left: 20px;
      z-index: 20;
      padding: 14px;
      border-radius: 13px;
      background: #35263a;
      color: white;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-100px);
      transition: opacity 0.3s, transform 0.3s;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.07); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(10deg); }
      50% { transform: translateY(-10px) rotate(-5deg); }
    }

    @keyframes pop {
      0% { transform: scale(0.5); }
      65% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes modalUp {
      from {
        opacity: 0.5;
        transform: translateY(45px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }



    @media (max-width: 500px) {
      body {
        padding: 0;
        background: var(--bg);
      }

      .app {
        max-width: none;
        height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }

      .screen {
        padding: 22px 17px 135px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <div class="app" id="app">

    <main class="screen" id="screen"></main>

    <button
      class="fab"
      id="addButton"
      aria-label="Додати завдання">
    </button>

    <nav class="navigation" id="navigation"></nav>

    <div class="overlay" id="overlay" hidden></div>

    <div class="toast" id="toast" role="status"></div>

  </div>

  <script>
    

    const app = document.getElementById("app");
    const screen = document.getElementById("screen");
    const navigation = document.getElementById("navigation");
    const addButton = document.getElementById("addButton");
    const overlay = document.getElementById("overlay");
    const toast = document.getElementById("toast");

    

    const icons = {
      home: '<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',

      calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',

      settings: '<path d="M12 3a2 2 0 0 1 2 2l1.5.6 1.8-.7 2 2-1 1.8.6 1.5 2.1.8v3l-2.1.8-.6 1.5 1 1.8-2 2-1.8-.7-1.5.6a2 2 0 0 1-4 0l-1.5-.6-1.8.7-2-2 1-1.8-.6-1.5L3 14v-3l2.1-.8.6-1.5-1-1.8 2-2 1.8.7L10 5a2 2 0 0 1 2-2Z"/><circle cx="12" cy="12.5" r="3"/>',

      plus: '<path d="M12 5v14M5 12h14"/>',

      check: '<path d="m5 12 4 4L19 6"/>',

      clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',

      bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',

      moon: '<path d="M20 15.2A8.5 8.5 0 0 1 8.8 4 8.5 8.5 0 1 0 20 15.2Z"/>',

      user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>',

      right: '<path d="m9 18 6-6-6-6"/>',

      left: '<path d="m15 18-6-6 6-6"/>',

      close: '<path d="M18 6 6 18M6 6l12 12"/>',

      edit: '<path d="m4 20 4.5-1 11-11-3.5-3.5-11 11L4 20ZM14 6l3.5 3.5"/>',

      trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6M14 11v6"/>',

      book: '<path d="M4 4h15v16H6a2 2 0 0 1-2-2V4Zm0 14a2 2 0 0 1 2-2h13"/>'
    };

    function icon(name, size = 20) {
      return `
        <svg
          width="${size}"
          height="${size}"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true">
          ${icons[name] || ""}
        </svg>
      `;
    }

    
    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    

    function pad(number) {
      return String(number).padStart(2, "0");
    }

    function dateISO(date) {
      return (
        date.getFullYear() + "-" +
        pad(date.getMonth() + 1) + "-" +
        pad(date.getDate())
      );
    }

    function dayAfter(days) {
      const date = new Date();
      date.setHours(12, 0, 0, 0);
      date.setDate(date.getDate() + days);
      return dateISO(date);
    }

    function today() {
      return dayAfter(0);
    }

    function dateText(value) {
      if (value === today()) return "Сьогодні";
      if (value === dayAfter(1)) return "Завтра";

      return new Date(value + "T12:00:00")
        .toLocaleDateString("uk-UA", {
          day: "numeric",
          month: "short"
        });
    }

    function fullDateText(value) {
      return new Date(value + "T12:00:00")
        .toLocaleDateString("uk-UA", {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric"
        });
    }

    function deadlineTime(task) {
      return new Date(
        task.date + "T" + task.time + ":00"
      ).getTime();
    }

    function isOverdue(task) {
      return !task.done && deadlineTime(task) < Date.now();
    }

    }

    function writeStorage(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch {
        console.warn("Не вдалося зберегти дані браузера");
      }
    }

      `);
    }

    

    let toastTimer;

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 3000);
    }

    

    function toggleTask(id) {
      const task = tasks.find(item => item.id === id);

      if (!task) return;

      task.done = !task.done;

      saveTasks();
      render();

      showToast(
        task.done
          ? "✓ Завдання виконано!"
          : "Завдання знову активне"
      );
    }

    

    addButton.addEventListener("click", () => {
      openTaskForm();
    });

    app.addEventListener("click", async event => {
      const button = event.target.closest(
        "[data-page], [data-filter], [data-toggle], " +
        "[data-open], [data-day], [data-month], " +
        "[data-setting], [data-action]"
      );

      if (!button) return;

      
      if (button.dataset.page) {
        state.page = button.dataset.page;

        render();
        screen.scrollTop = 0;
        return;
      }

      
      if (button.dataset.filter) {
        state.filter = button.dataset.filter;
        render();
        return;
      }

      
      if (button.dataset.toggle) {
        toggleTask(button.dataset.toggle);
        return;
      }

      
      if (button.dataset.open) {
        openTaskDetails(button.dataset.open);
        return;
      }

      
      if (button.dataset.day) {
        state.selectedDate = button.dataset.day;
        render();
        return;
      }

      
      if (button.dataset.month) {
        const next = new Date(
          state.year,
          state.month + Number(button.dataset.month),
          1
        );

        state.year = next.getFullYear();
        state.month = next.getMonth();

        render();
        return;
      }

      
      if (button.dataset.setting) {
        const setting = button.dataset.setting;

        if (setting === "theme") {
          settings.theme =
            settings.theme === "dark"
              ? "light"
              : "dark";
        }

        if (setting === "notifications") {
          settings.notifications = !settings.notifications;

          
          if (
            settings.notifications &&
            "Notification" in window &&
            window.isSecureContext &&
            Notification.permission === "default"
          ) {
            try {
              await Notification.requestPermission();
            } catch (error) {
              console.warn(error);
            }
          }

          showToast(
            settings.notifications
              ? "Нагадування увімкнено 🔔"
              : "Нагадування вимкнено"
          );
        }

        saveSettings();
        render();
        return;
      }

      const action = button.dataset.action;

      if (action === "close") {
        closeModal();
      }

      if (action === "edit") {
        const id = state.detailId;
        openTaskForm(id);
      }

      if (action === "askDelete") {
        askDeleteTask();
      }

      if (action === "confirmDelete") {
        tasks = tasks.filter(task =>
          task.id !== state.detailId
        );

        saveTasks();
        closeModal();
        render();

        showToast("Завдання видалено");
      }

      if (action === "complete") {
        const id = state.detailId;

        closeModal();
        toggleTask(id);
      }

      if (action === "goTasks") {
        closeModal();

        state.page = "tasks";
        state.filter = "all";

        render();
        screen.scrollTop = 0;
      }

      if (action === "addAnother") {
        closeModal();
        openTaskForm();
      }

      if (action === "saveProfile") {
        const input = document.getElementById("profileName");

        settings.name = input.value.trim() || "Студентка";

        saveSettings();
        render();

        showToast("Ім'я збережено 💗");
      }

      if (action === "clearCompleted") {
        const completedCount =
          tasks.filter(task => task.done).length;

        if (completedCount === 0) {
          showToast("Немає виконаних завдань");
          return;
        }

        const confirmed = confirm(
          "Видалити всі виконані завдання?"
        );

        if (!confirmed) return;

        tasks = tasks.filter(task => !task.done);

        saveTasks();
        render();

        showToast("Виконані завдання очищено");
      }
    });

    

    app.addEventListener("submit", event => {
      if (event.target.id !== "taskForm") return;

      event.preventDefault();

      const titleInput =
        document.getElementById("taskTitle");

      const descriptionInput =
        document.getElementById("taskDescription");

      const dateInput =
        document.getElementById("taskDate");

      const timeInput =
        document.getElementById("taskTime");

      const reminderInput =
        document.getElementById("taskReminder");

      const titleError =
        document.getElementById("titleError");

      titleInput.classList.remove("invalid");
      titleError.textContent = "";

      const title = titleInput.value.trim();


      if (!title) {
        titleInput.classList.add("invalid");
        titleError.textContent =
          "Введи назву завдання";

        titleInput.focus();
        return;
      }

      if (!dateInput.value || !timeInput.value) {
        showToast("Обери дату й час");
        return;
      }

      const existing = tasks.find(task =>
        task.id === state.editingId
      );

      const newTask = {
        id: existing ? existing.id : createId(),
        title: title,
        description: descriptionInput.value.trim(),
        date: dateInput.value,
        time: timeInput.value,
        reminder: reminderInput.value,
        done: existing ? existing.done : false
      };

      if (existing) {
        tasks = tasks.map(task =>
          task.id === existing.id ? newTask : task
        );
      } else {
        tasks.push(newTask);
      }

      saveTasks();

      state.page = "tasks";
      state.filter = "all";

      render();

      if (existing) {
        closeModal();
        showToast("✓ Зміни збережено!");
      } else {
        showSuccess();
      }
    });

    

    app.addEventListener("change", event => {
      if (event.target.id === "defaultReminder") {
        settings.defaultReminder = event.target.value;

        saveSettings();
        showToast("Налаштування збережено");
      }
    });

    

    overlay.addEventListener("click", event => {
      if (event.target === overlay) {
        closeModal();
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && !overlay.hidden) {
        closeModal();
      }
    });

    

    function checkReminders() {
      if (!settings.notifications) return;

      const now = Date.now();

      for (const task of tasks) {
        if (task.done || task.reminder === "off") {
          continue;
        }

        const deadline = deadlineTime(task);

        const reminderAt =
          deadline - Number(task.reminder) * 60 * 1000;

        const reminderKey = [
          task.id,
          task.date,
          task.time,
          task.reminder
        ].join("|");

        
        if (
          now >= reminderAt &&
          now < reminderAt + 60 * 1000 &&
          !sentReminders.has(reminderKey)
        ) {
          sentReminders.add(reminderKey);

          writeStorage(
            REMINDERS_KEY,
            [...sentReminders]
          );

          showToast("🔔 Нагадування: " + task.title);


          if (
            "Notification" in window &&
            Notification.permission === "granted"
          ) {
            try {
              new Notification("Дедлайнер 🔔", {
                body:
                  task.title +
                  " — " +
                  dateText(task.date) +
                  " о " +
                  task.time
              });
            } catch (error) {
              console.warn(error);
            }
          }
        }
      }
    }

    
    setInterval(checkReminders, 15000);

    document.addEventListener(
      "visibilitychange",
      checkReminders
    );

    render();
    checkReminders();

    console.log("💗 Дедлайнер успішно запущено!");
  </script>

</body>
</html>
